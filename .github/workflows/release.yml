name: Release plugin

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          /** Reads the JSON metadata at the given path and returns its parsed value. */
          function readJson(path) {
            return JSON.parse(readFileSync(path, 'utf8'));
          }

          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Use a stable tag such as 0.2.0, without a v prefix');
          const manifest = readJson('manifest.json');
          const pkg = readJson('package.json');
          const lock = readJson('package-lock.json');
          const versions = readJson('versions.json');
          assert.equal(manifest.version, tag, 'manifest.json version must match the tag');
          assert.equal(pkg.version, tag, 'package.json version must match the tag');
          assert.equal(lock.version, tag, 'package-lock.json version must match the tag');
          assert.equal(lock.packages[''].version, tag, 'Lockfile root package version must match the tag');
          assert.equal(typeof manifest.minAppVersion, 'string', 'manifest.json must define minAppVersion');
          assert.equal(versions[tag], manifest.minAppVersion, 'versions.json must map the tag to minAppVersion');
          NODE

      - run: npm ci
      - run: npm run check
      - run: npm run format:check

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/base-path-updater/main.js
            dist/base-path-updater/manifest.json
            dist/base-path-updater/styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=(--generate-notes)
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
          fi
          gh release create "$RELEASE_TAG" \
            dist/base-path-updater/main.js \
            dist/base-path-updater/manifest.json \
            dist/base-path-updater/styles.css \
            --verify-tag \
            --title "$RELEASE_TAG" \
            "${notes[@]}"
